<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box {
            border: 1px solid rgb(232, 29, 29);
            display: inline-block;
            padding: 10px;
            margin: 10px;

        }
        .box1{
           border: 1px solid rgb(232, 29, 29);
            display: inline-block;
            padding: 10px;
            margin: 10px;
            /* display: none; */
            /* visibility: hidden; */

        }
    </style>
</head>

<body>
    <div class="box box1">
        i am box
    </div>
    <div class="box"> i am king</div>
    <span>i am span</span>
    <span> i am boy</span>
</body>

</html>
