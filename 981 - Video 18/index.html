<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX MODEL</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            
        }
        .box{
            background-color: red;
        }
        .box1{
            color:yellow;
            padding: 20px;
            margin: 40px;
            border: 5px solid black;
            height: 100px;
            box-sizing: border-box;
        }
        .box2{
            color:blue;
           ;
            padding: 20px;
            margin: 20px;
            border: 5px solid black;
            height: 100px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box box1">
        I am box model
    </div>
    <div class="box box2">
        I am also a box
    </div>
</body>
</html>
