<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 5 challenge layout</title>
    <style>
        .boxes {
            border: 2px solid black;
            width: 500px;
            /* height: 490px; */
            background-color: rgb(0, 255, 255);
        }

        body {
            min-height: 200vh;
        }

        .box1 {
            border: 2px solid black;
            margin: 5px;

            padding: 5px;

            background-color: rgb(227, 118, 64)
        }

        .b1 {
            border: 2px solid black;
            width: 200px;
            height: 100px;
            margin: 10px;
            padding: 5px;
            background-color: rgb(255, 255, 105);
            display: inline-block;
            /* overflow: auto; */



        }

        .b2 {
            border: 2px solid black;
            width: 200px;
            height: 100px;
            margin: 10px;
            display: inline-block;
            padding: 5px;
            background-color: rgb(137, 249, 137);
            /* overflow: auto; */


        }

        nav {
            border: 2px solid black;
            margin: 5px;
            padding: 5px;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgb(233, 120, 139);




        }

        nav ul li {
            list-style-type: none;
            padding: 20px;
            margin: 15px;
            display: inline;



        }



        .tb {
            border: 2px solid black;
            width: 300px;
            height: 100px;
            margin: 5px;
            padding: 5px;
            text-align: center;
            border-radius: 45px;
            background-color: rgb(158, 158, 218);
            margin-left: 80px;
            margin-right: 80px;



        }

        p {
            margin: 40px 20px;
        }

        .icon {
            border: 2px solid black;
            width: 70px;
            height: 70px;
            border-radius: 41px;
            margin-left: 400px;
            position: fixed;
            margin-bottom: 5px;

        }

        .icon img {
            border: 2px solid black;
            width: 70px;
            height: 70px;
            border-radius: 45px;
            /* margin-left: 400px; */
            position: fixed;



        }

        .footer {
            border: 2px solid black;
            width: 479px;
            height: 58px;
            /* margin:9px; */
            /* padding: px; */
            background-color: rgb(213, 157, 181);
            text-align: center;
            margin-top: 85px;
            margin-left: 9px;


        }
    </style>
</head>

<body>
    <div class="boxes">
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
        <div class="box1">
            <div class="b1">

            </div>
            <div class="b2">

            </div>
        </div>
        <div class="tb">
            <p>welocome to sigma web development</p>
        </div>
        <div class="icon">
            <img src="https://i.pinimg.com/736x/82/67/e2/8267e29f161820a9621fdf15a6be83dd.jpg">
        </div>
        <footer class="footer">
            copyright@gopi
        </footer>
    </div>
</body>

</html>
