<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow and outlines</title>
    <style>
        .box {
            border: 1px solid black;
            padding: 34px;
            box-shadow: 15px 15px 5px 5px #f7101080;
            outline: 1px solid black;
            outline-offset: 10px;
            border-radius: 10px;
        }
        .text-shadow {
            text-shadow: 20px 20px 2px #00ff5580;
            outline: 1px solid black;
            outline-offset: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        i am a box
    </div>
    <p class="text-shadow">
       Lorem ipsum dolor sit amet consectetur adipisicing elit. Consectetur vero est suscipit beatae eos voluptas unde vel eum dolorem possimus, non ex nemo?
    </p>
</body>
</html>
