        .box{

            border:2px solid black;
            width: 600px;
            background-color: rgb(37, 231, 66);

            margin:auto;


        }
        .container{

            border:2px solid black;

            margin:23px auto;
         }
         .mycont{
            background-color: rgb(125, 24, 171);

            width: 600px;
            height: 30vh;
            text-align: center;
            margin:23px auto;

            /* width:100vmax; */
            /* height:100vmin; */
            /* height:100vmax; */

         }
    </style>
</head>
<body>
    <div class="box">
        this is a box

    <div class="container">
        this is a container

</html>
